name: GraveNav checks

on:
  push:
    branches: [main, codex/staff-accounts-v1-release]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Repository tests
        run: npm test

      - name: Dependency audit
        run: npm audit --omit=dev

      - name: Production build
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare disposable service images
        run: |
          docker pull postgis/postgis:17-3.5
      - name: PostgreSQL integration tests
        run: npm run test:integration
